<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Agent Policy Map cross-agent comparison</title>
  <desc id="description">The CLI compares one file across Codex CLI, Claude Code, Cursor IDE, and GitHub Copilot CLI, showing matching AGENTS.md discovery under the default Claude instruction mode.</desc>
  <rect width="1200" height="650" rx="24" fill="#0b1220"/>
  <rect x="1" y="1" width="1198" height="648" rx="23" fill="none" stroke="#253247" stroke-width="2"/>

  <circle cx="42" cy="38" r="7" fill="#ef4444"/>
  <circle cx="66" cy="38" r="7" fill="#f59e0b"/>
  <circle cx="90" cy="38" r="7" fill="#22c55e"/>
  <text x="600" y="44" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">agent-policy-map compare</text>
  <line x1="0" y1="68" x2="1200" y2="68" stroke="#253247" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="112" fill="#22c55e" font-size="20">$</text>
    <text x="64" y="112" fill="#e2e8f0" font-size="20">agent-policy-map compare src/cli.ts --cwd . --root .</text>

    <text x="40" y="160" fill="#94a3b8" font-size="18">Target:</text>
    <text x="244" y="160" fill="#f8fafc" font-size="18">./src/cli.ts</text>
    <text x="40" y="190" fill="#94a3b8" font-size="18">Surfaces:</text>
    <text x="244" y="190" fill="#f8fafc" font-size="18">Codex CLI | Claude Code | Cursor IDE | GitHub Copilot CLI</text>
    <text x="40" y="220" fill="#94a3b8" font-size="18">Result:</text>
    <text x="244" y="220" fill="#4ade80" font-size="18" font-weight="700">0 meaningful local differences</text>

    <text x="40" y="276" fill="#f8fafc" font-size="17" font-weight="700">SOURCE</text>
    <text x="430" y="276" fill="#f8fafc" font-size="17" font-weight="700">CODEX</text>
    <text x="570" y="276" fill="#f8fafc" font-size="17" font-weight="700">CLAUDE</text>
    <text x="710" y="276" fill="#f8fafc" font-size="17" font-weight="700">CURSOR</text>
    <text x="850" y="276" fill="#f8fafc" font-size="17" font-weight="700">COPILOT</text>
    <text x="1010" y="276" fill="#f8fafc" font-size="17" font-weight="700">DIFF</text>
    <line x1="40" y1="292" x2="1120" y2="292" stroke="#334155" stroke-width="2"/>

    <text x="40" y="330" fill="#e2e8f0" font-size="18">./AGENTS.md</text>
    <text x="430" y="330" fill="#4ade80" font-size="18">active</text>
    <text x="570" y="330" fill="#4ade80" font-size="18">active</text>
    <text x="710" y="330" fill="#4ade80" font-size="18">active</text>
    <text x="850" y="330" fill="#4ade80" font-size="18">active</text>
    <text x="1010" y="330" fill="#94a3b8" font-size="18">—</text>

    <text x="40" y="388" fill="#fbbf24" font-size="18" font-weight="700">WHY THIS FILE LOADS</text>
    <text x="40" y="426" fill="#f8fafc" font-size="18">./AGENTS.md</text>
    <text x="64" y="454" fill="#94a3b8" font-size="17">codex</text>
    <text x="150" y="454" fill="#4ade80" font-size="17">active</text>
    <text x="242" y="454" fill="#e2e8f0" font-size="17">root-to-launch-cwd discovery</text>
    <text x="64" y="486" fill="#94a3b8" font-size="17">claude</text>
    <text x="150" y="486" fill="#4ade80" font-size="17">active</text>
    <text x="242" y="486" fill="#e2e8f0" font-size="17">AGENTS.md fallback; no project CLAUDE.md</text>
    <text x="64" y="518" fill="#94a3b8" font-size="17">cursor</text>
    <text x="150" y="518" fill="#4ade80" font-size="17">active</text>
    <text x="242" y="518" fill="#e2e8f0" font-size="17">directory subtree applies to target</text>
    <text x="64" y="550" fill="#94a3b8" font-size="17">copilot</text>
    <text x="150" y="550" fill="#4ade80" font-size="17">active</text>
    <text x="242" y="550" fill="#e2e8f0" font-size="17">repository-to-target discovery</text>

    <text x="40" y="598" fill="#94a3b8" font-size="16">Current Claude default mode. Local, read-only, no LLM.</text>
    <text x="40" y="624" fill="#64748b" font-size="15">Static discovery evidence; not proof that a live agent followed instructions.</text>
  </g>
</svg>
